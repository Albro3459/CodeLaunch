services:
  cliproxyapi:
    # Pinned by digest (v7.2.92, commit 53c1e7e) since tags can move upstream.
    # To move: pull the new image, verify /v1/models and effort, then update the digest here and the version in TOOL-VERSIONS.md.
    image: eceasy/cli-proxy-api@sha256:af18f6fb364bfb7b482a1ca6c6c85fd7df2c0d6a3a497ebb82c337ac2216dc41
    container_name: cliproxyapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"   # loopback only, never 0.0.0.0
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./auth:/root/.cli-proxy-api
