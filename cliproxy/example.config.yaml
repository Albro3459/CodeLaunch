# Copy to config.yaml and set a real api-key. config.yaml is gitignored.
# host is 0.0.0.0 inside the container. Exposure is restricted by the
# 127.0.0.1 publish in docker-compose.yml.
host: "0.0.0.0"
port: 8317

remote-management:
  allow-remote: false
  secret-key: ""

auth-dir: "/root/.cli-proxy-api"

# Effort debugging: set all three to true, restart the container, then read
# auth/logs/v1-messages-*.log - each shows the incoming Claude request and the
# translated upstream codex body, so you can confirm reasoning.effort applied.
# debug: true
# logging-to-file: true
# request-log: true

# Aliasing replaces the upstream id: once a model is aliased, the raw id
# stops resolving and only the alias names route. One upstream id can carry
# many aliases, and they all coexist (check /v1/models to see every name).
#
# Names here must stay in sync with ANTHROPIC_DEFAULT_*_MODEL in ../claudex,
# or role lookups fail. They don't need to match customModels in
# ~/.t3/userdata/settings.json - see the T3 note below.
#
# An alias that differs from the upstream id only by case gets ignored, so
# every alias needs a real character difference - hence the spaces, including
# in "GPT 5.5".
oauth-model-alias:
  codex:
    - name: "gpt-5.6-sol"
      alias: "GPT-5.6 Sol"
    - name: "gpt-5.6-luna"
      alias: "GPT-5.6 Luna"
    - name: "gpt-5.5"
      alias: "GPT 5.5"
    - name: "gpt-5.4-mini"
      alias: "GPT 5.4 mini"
    # T3 effort fix. T3 only passes `effort` to the Agent SDK for built-in
    # Claude model slugs, not custom models. Aliasing to a claude-* slug gets
    # T3 to attach effort (low->low, medium->medium, high->high, max->xhigh).
    # Downside: the model thinks it's Claude, so asking it what it is gives a
    # confident wrong answer.
    #
    # The CLI doesn't need this: ANTHROPIC_DEFAULT_*_SUPPORTED_CAPABILITIES in
    # ../claudex already tells Claude Code the friendly names accept effort.
    #
    # The [1m] variants cover T3's 1M context-window toggle. Haiku 4.5 has no
    # effort selector in T3, only a thinking toggle, so mini gets no effort
    # control through the app.
    - name: "gpt-5.6-sol"
      alias: "claude-fable-5"
    - name: "gpt-5.6-sol"
      alias: "claude-fable-5[1m]"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-5"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-5[1m]"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-4-8"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-4-7"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-4-6"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-4-6[1m]"
    - name: "gpt-5.6-luna"
      alias: "claude-opus-4-5"
    - name: "gpt-5.5"
      alias: "claude-sonnet-5"
    - name: "gpt-5.5"
      alias: "claude-sonnet-5[1m]"
    - name: "gpt-5.5"
      alias: "claude-sonnet-4-6"
    - name: "gpt-5.5"
      alias: "claude-sonnet-4-6[1m]"
    - name: "gpt-5.4-mini"
      alias: "claude-haiku-4-5"

api-keys:
  - "REPLACE_WITH_LOCAL_API_KEY"

# This block is a no-op, kept only as documentation. `default` fills
# reasoning.effort only when the client omits it, but the /v1/messages ->
# codex translation always sets a level first, so there's nothing to fill.
# Effort ends up controlled by the client (Claude Code's /effort and
# per-agent frontmatter), not by the proxy.
#
# Don't switch this to `override` - that force-replaces client values and
# breaks per-agent effort. Names here are the upstream ids, not the
# oauth-model-alias values. Alias resolution does happen, but it's unclear
# whether it runs before or after this matching.
payload:
  default:
    - models:
        - name: "gpt-5.6-sol"
          protocol: "codex"
        - name: "gpt-5.6-luna"
          protocol: "codex"
      params:
        "reasoning.effort": "high"
    - models:
        - name: "gpt-5.5"
          protocol: "codex"
        - name: "gpt-5.4-mini"
          protocol: "codex"
      params:
        "reasoning.effort": "medium"
